[project]
name = "licite-comigo-ingest"
version = "0.4.0"
description = "Conectores, workers e normalização de dados públicos do Licite Comigo."
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "pika>=1.3,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
