[project]
name = "licite-comigo-ai"
version = "0.1.0"
description = "Agentes de IA e assistente Ana do Licite Comigo."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
