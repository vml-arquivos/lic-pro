function renderOpportunities(arr){return arr.length?arr.map((o)=>`<div class="listcard"><div class="row"><span class="tag">${o.mod}</span><span class="tag blue">Compatibilidade ${o.fit}</span></div><h3>${o.obj}</h3><div class="row small"><span>🏛 ${o.org} · ${o.uf}</span><span>💰 <b>${fmt(o.value)}</b></span><span>📅 ${o.date}</span><span>🖥 ${o.portal}</span></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn secondary" onclick="go('mercado')">Ver mercado</button><button class="btn" onclick="activeOpportunity=${opportunities.indexOf(o)};go('analise')">Analisar oportunidade →</button></div></div>`).join(''):'<div class="notice">Nenhuma oportunidade demonstrativa atende aos filtros selecionados.</div>'}function applyFilters(){const term=document.getElementById('term').value.toLowerCase(),portal=document.getElementById('portal').value,uf=document.getElementById('uf').value,max=Number(document.getElementById('max').value);document.getElementById('results').innerHTML=renderOpportunities(opportunities.filter(o=>(!term||(`${o.obj} ${o.org}`).toLowerCase().includes(term))&&(portal==='Todas'||o.portal===portal)&&(uf==='Todos os estados'||o.uf===uf)&&(!max||o.value<=max)))}function calcPrice(){const v=id=>Number(document.getElementById(id)?.value||0),c=v('custo')+v('frete')+v('operacao')+v('risco'),den=1-(v('aliquota')+v('lucro'))/100;document.getElementById('price').textContent=den>0?fmt(c/den):'Percentuais inválidos';document.getElementById('costs').textContent=fmt(c)}function askAna(q){document.getElementById('anatext').textContent=q==='Qual é o próximo passo?'?'Sugiro começar pelo diagnóstico da empresa e localizar oportunidades compatíveis.':q==='Quais documentos faltam?'?'Verifique a Central de Documentos. A análise real depende de seus arquivos e do edital.':'Antes de participar, confira requisitos, fornecedor, margem e riscos. Acesse Analisar oportunidade.'}function toggleAna(){anaOpen=!anaOpen;document.querySelector('.anabody').classList.toggle('hidden',!anaOpen);document.querySelector('.anahead button').textContent=anaOpen?'−':'+'}go('inicio');</script></body></html>
