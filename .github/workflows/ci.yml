name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: licite_comigo
          POSTGRES_USER: licite_admin
          POSTGRES_PASSWORD: change-me-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licite_admin -d licite_comigo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Build migration image
        run: docker build --file db/Dockerfile.migrate --tag licite-migrate:ci .
      - name: Apply migrations via migration image
        env:
          MIGRATION_DATABASE_URL: postgresql://licite_admin:change-me-ci-only@127.0.0.1:5432/licite_comigo
          CORE_DB_PASSWORD: change-me-core-ci-only
          INGEST_DB_PASSWORD: change-me-ingest-ci-only
          AI_DB_PASSWORD: change-me-ai-ci-only
          BID_DB_PASSWORD: change-me-bid-ci-only
          REALTIME_DB_PASSWORD: change-me-realtime-ci-only
        run: |
          docker run --rm --network host \
            --env MIGRATION_DATABASE_URL \
            --env CORE_DB_PASSWORD \
            --env INGEST_DB_PASSWORD \
            --env AI_DB_PASSWORD \
            --env BID_DB_PASSWORD \
            --env REALTIME_DB_PASSWORD \
            licite-migrate:ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate runtime environment contract
        run: pnpm env:check
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        env:
          TEST_APP_ROLE: licite_core
          TEST_DATABASE_URL: postgresql://licite_core:change-me-core-ci-only@localhost:5432/licite_comigo
          TEST_ADMIN_DATABASE_URL: postgresql://licite_admin:change-me-ci-only@localhost:5432/licite_comigo
        run: pnpm test
      - name: Build
        run: pnpm build

  production-migration:
    name: Production migration path
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: licite_comigo
          POSTGRES_USER: licite_admin
          POSTGRES_PASSWORD: change-me-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licite_admin -d licite_comigo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Build migration image
        run: docker build --file db/Dockerfile.migrate --tag licite-migrate:ci .
      - name: Run migration image against fresh PostgreSQL
        env:
          MIGRATION_DATABASE_URL: postgresql://licite_admin:change-me-ci-only@127.0.0.1:5432/licite_comigo
          CORE_DB_PASSWORD: change-me-core-ci-only
          INGEST_DB_PASSWORD: change-me-ingest-ci-only
          AI_DB_PASSWORD: change-me-ai-ci-only
          BID_DB_PASSWORD: change-me-bid-ci-only
          REALTIME_DB_PASSWORD: change-me-realtime-ci-only
        run: |
          docker run --rm --network host \
            --env MIGRATION_DATABASE_URL \
            --env CORE_DB_PASSWORD \
            --env INGEST_DB_PASSWORD \
            --env AI_DB_PASSWORD \
            --env BID_DB_PASSWORD \
            --env REALTIME_DB_PASSWORD \
            licite-migrate:ci
      - name: Verify schema migrations and role safety
        env:
          PGPASSWORD: change-me-ci-only
        run: |
          test "$(psql postgresql://licite_admin@127.0.0.1:5432/licite_comigo -tAc "SELECT count(*) FROM schema_migrations" | tr -d '[:space:]')" -eq 12
          test "$(psql postgresql://licite_admin@127.0.0.1:5432/licite_comigo -tAc "SELECT rolcanlogin FROM pg_roles WHERE rolname = 'licite_owner'" | tr -d '[:space:]')" = "f"
          if psql postgresql://licite_admin@127.0.0.1:5432/licite_comigo -tAc "SELECT 1 FROM pg_roles WHERE rolname IN ('licite_core', 'licite_ingest', 'licite_ai', 'licite_bid', 'licite_realtime') AND (NOT rolcanlogin OR rolsuper OR rolbypassrls)" | grep -q 1; then
            echo 'role de aplicação sem login ou com superuser/bypassrls' >&2
            exit 1
          fi
          test "$(psql postgresql://licite_admin@127.0.0.1:5432/licite_comigo -tAc "SELECT has_schema_privilege('licite_owner', 'public', 'USAGE')" | tr -d '[:space:]')" = "t"
          psql postgresql://licite_admin@127.0.0.1:5432/licite_comigo -c "SELECT filename, applied_at FROM schema_migrations ORDER BY filename;"
          psql postgresql://licite_admin@127.0.0.1:5432/licite_comigo -c "SELECT rolname, rolsuper, rolbypassrls, rolcanlogin FROM pg_roles WHERE rolname IN ('licite_admin', 'licite_owner', 'licite_core', 'licite_ingest', 'licite_ai', 'licite_bid', 'licite_realtime') ORDER BY rolname;"
      - name: Run migration image a second time (idempotency)
        env:
          MIGRATION_DATABASE_URL: postgresql://licite_admin:change-me-ci-only@127.0.0.1:5432/licite_comigo
          CORE_DB_PASSWORD: change-me-core-ci-only
          INGEST_DB_PASSWORD: change-me-ingest-ci-only
          AI_DB_PASSWORD: change-me-ai-ci-only
          BID_DB_PASSWORD: change-me-bid-ci-only
          REALTIME_DB_PASSWORD: change-me-realtime-ci-only
        run: |
          docker run --rm --network host \
            --env MIGRATION_DATABASE_URL \
            --env CORE_DB_PASSWORD \
            --env INGEST_DB_PASSWORD \
            --env AI_DB_PASSWORD \
            --env BID_DB_PASSWORD \
            --env REALTIME_DB_PASSWORD \
            licite-migrate:ci
      - name: Verify ownership, RLS and foreign-key path
        env:
          PGPASSWORD: change-me-ci-only
        run: |
          ADMIN=postgresql://licite_admin@127.0.0.1:5432/licite_comigo
          # Toda tabela, sequência ou view de public pertence a licite_owner.
          wrong_owner="$(psql "$ADMIN" -tAc "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','S','v','m','p') AND pg_get_userbyid(c.relowner) <> 'licite_owner'")"
          if [ -n "$wrong_owner" ]; then echo "objetos com dono diferente de licite_owner:" >&2; echo "$wrong_owner" >&2; exit 1; fi
          # Toda tabela com tenant_id/empresa_id tem RLS habilitado.
          no_rls="$(psql "$ADMIN" -tAc "SELECT DISTINCT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace JOIN information_schema.columns col ON col.table_schema = 'public' AND col.table_name = c.relname WHERE n.nspname = 'public' AND c.relkind = 'r' AND col.column_name IN ('tenant_id','empresa_id') AND NOT c.relrowsecurity")"
          if [ -n "$no_rls" ]; then echo "tabelas com tenant_id/empresa_id sem RLS:" >&2; echo "$no_rls" >&2; exit 1; fi
          # A role da aplicação consegue gravar com chaves estrangeiras (cadastro). Falha
          # com "permission denied for schema public" se licite_owner perder o USAGE.
          PGPASSWORD=change-me-core-ci-only psql postgresql://licite_core@127.0.0.1:5432/licite_comigo -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SELECT set_config('app.tenant_id', '00000000-0000-0000-0000-0000000000aa', true);
          SELECT set_config('app.user_id', '00000000-0000-0000-0000-0000000000bb', true);
          INSERT INTO tenants (id, nome, slug) VALUES ('00000000-0000-0000-0000-0000000000aa', 'CI', 'ci-fk-smoke');
          INSERT INTO usuarios (id, tenant_id, email, nome, papel) VALUES ('00000000-0000-0000-0000-0000000000bb', '00000000-0000-0000-0000-0000000000aa', 'ci@example.test', 'CI', 'admin');
          ROLLBACK;
          SQL

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/ingest, services/ai]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest

  rabbitmq-integration:
    name: RabbitMQ integration
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: licite
          RABBITMQ_DEFAULT_PASS: change-me-ci-only
          RABBITMQ_DEFAULT_VHOST: licite_comigo
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingest dependencies
        run: python -m pip install --upgrade pip && pip install -e 'services/ingest[dev]'
      - name: Publish and consume edital.novo
        env:
          RABBITMQ_URL: amqp://licite:change-me-ci-only@127.0.0.1:5672/licite_comigo
        run: pytest -q services/ingest/tests/test_rabbitmq_integration.py

  docker-smoke:
    name: Docker smoke (site and web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site image
        run: docker build --file apps/site/Dockerfile --tag licite-site:ci .
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag licite-web:ci .
      - name: Run site without overriding HOSTNAME
        run: |
          set -e
          docker run --detach --name licite-site-ci --publish 3100:3100 \
            --env APP_ENV=production \
            --env SITE_URL=http://127.0.0.1:3100 \
            --env APP_URL=http://127.0.0.1:3000 \
            --env CORE_API_INTERNAL_URL=http://127.0.0.1:3001 \
            licite-site:ci
          trap 'docker rm --force licite-site-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3100/health && exit 0
            sleep 2
          done
          docker logs licite-site-ci
          exit 1
      - name: Run web without overriding HOSTNAME
        run: |
          set -e
          docker run --detach --name licite-web-ci --publish 3000:3000 \
            --env APP_ENV=production \
            --env APP_URL=http://127.0.0.1:3000 \
            --env CORE_API_INTERNAL_URL=http://127.0.0.1:3001 \
            --env AI_INTERNAL_URL=http://127.0.0.1:8000 \
            licite-web:ci
          trap 'docker rm --force licite-web-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          docker logs licite-web-ci
          exit 1
