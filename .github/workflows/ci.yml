name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: licite_comigo
          POSTGRES_USER: licite
          POSTGRES_PASSWORD: change-me-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licite -d licite_comigo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: change-me-ci-only
        run: |
          for file in db/migrations/*.sql; do
            psql --host localhost --username licite --dbname licite_comigo --set ON_ERROR_STOP=1 --file "$file"
          done
          psql --host localhost --username licite --dbname licite_comigo --set ON_ERROR_STOP=1 \
            --command "ALTER ROLE licite_core LOGIN PASSWORD 'change-me-ci-only'"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate runtime environment contract
        run: pnpm env:check
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        env:
          TEST_APP_ROLE: licite_core
          TEST_DATABASE_URL: postgresql://licite_core:change-me-ci-only@localhost:5432/licite_comigo
        run: pnpm test
      - name: Build
        run: pnpm build

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/ingest, services/ai]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest
