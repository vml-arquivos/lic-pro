services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-licite_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /licite_comigo
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [private]

  migrate:
    image: pgvector/pgvector:pg16
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      BID_DB_PASSWORD: ${BID_DB_PASSWORD}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/sh', '/migrate.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORE_API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      DATABASE_URL: ${CORE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      WS_URL: ${WS_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    expose: ['3001']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3001/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AI_PORT: 8000
      DATABASE_URL: ${AI_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      AI_JWT_ALGORITHM: ${AI_JWT_ALGORITHM}
      AI_JWT_SECRET: ${AI_JWT_SECRET}
      AI_JWT_PUBLIC_KEY: ${AI_JWT_PUBLIC_KEY}
      AI_JWT_ISSUER: ${AI_JWT_ISSUER}
      AI_JWT_AUDIENCE: ${AI_JWT_AUDIENCE}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL}
      ANA_HISTORY_RETENTION_DAYS: ${ANA_HISTORY_RETENTION_DAYS}
      AI_MAX_PDF_BYTES: ${AI_MAX_PDF_BYTES:-20971520}
      AI_MAX_PDF_PAGES: ${AI_MAX_PDF_PAGES:-200}
      AI_READER_TIMEOUT_SECONDS: ${AI_READER_TIMEOUT_SECONDS:-30}
      AI_RATE_LIMIT_PER_MINUTE_USER: ${AI_RATE_LIMIT_PER_MINUTE_USER:-20}
      AI_RATE_LIMIT_PER_MINUTE_TENANT: ${AI_RATE_LIMIT_PER_MINUTE_TENANT:-100}
      AI_DEFAULT_MONTHLY_CALL_LIMIT: ${AI_DEFAULT_MONTHLY_CALL_LIMIT:-1000}
      AI_DEFAULT_MONTHLY_TOKEN_LIMIT: ${AI_DEFAULT_MONTHLY_TOKEN_LIMIT:-1000000}
    expose: ['8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    environment:
      INGEST_PORT: 8100
      DATABASE_URL: ${INGEST_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PNCP_BASE_URL: ${PNCP_BASE_URL}
      COMPRAS_GOV_BASE_URL: ${COMPRAS_GOV_BASE_URL}
    expose: ['8100']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8100/health\", timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  ingest-worker:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    command:
      ['celery', '-A', 'src.worker.celery_app', 'worker', '--loglevel=INFO', '--queues=ingest']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${INGEST_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PNCP_BASE_URL: ${PNCP_BASE_URL}
      INGEST_MAX_RETRIES: ${INGEST_MAX_RETRIES:-3}
      INGEST_RATE_LIMIT_SECONDS: ${INGEST_RATE_LIMIT_SECONDS:-0.2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [private]

  ingest-scheduler:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    command: ['celery', '-A', 'src.worker.celery_app', 'beat', '--loglevel=INFO']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${INGEST_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INGEST_SCHEDULE_SECONDS: ${INGEST_SCHEDULE_SECONDS:-900}
      INGEST_SCHEDULE_TENANT_ID: ${INGEST_SCHEDULE_TENANT_ID}
      INGEST_SCHEDULE_MODALITY_CODE: ${INGEST_SCHEDULE_MODALITY_CODE:-6}
      INGEST_SCHEDULE_UF: ${INGEST_SCHEDULE_UF}
      INGEST_WINDOW_DAYS: ${INGEST_WINDOW_DAYS:-1}
    depends_on:
      ingest-worker:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [private]

  bid-engine:
    profiles: [future]
    build:
      context: .
      dockerfile: services/bid-engine/Dockerfile
    restart: unless-stopped
    environment:
      BID_ENGINE_PORT: 3002
      DATABASE_URL: ${BID_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    expose: ['3002']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3002/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  realtime-gw:
    profiles: [future]
    build:
      context: .
      dockerfile: services/realtime-gw/Dockerfile
    restart: unless-stopped
    environment:
      REALTIME_PORT: 3003
      DATABASE_URL: ${REALTIME_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WS_URL: ${WS_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    expose: ['3003']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3003/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      CORE_API_INTERNAL_URL: http://core-api:3001
      WS_URL: ${WS_URL}
      AI_INTERNAL_URL: http://ai:8000
    expose: ['3000']
    depends_on:
      core-api:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

volumes:
  postgres_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:

networks:
  private:
    driver: bridge
